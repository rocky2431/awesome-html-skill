<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Page name</title>
<style>
/* Design plan. Replace every value with this page's own choices (references/design.md).
   Layout: one sentence naming the layout concept, e.g. "answer up top, three evidence panels, diagram full width". */
:root {
  --paper: #f7f8fa;      /* page background */
  --surface: #ffffff;    /* figures, tables, code */
  --ink: #17191c;        /* body text */
  --muted: #5c636c;      /* captions, secondary text */
  --rule: #dfe3e8;       /* hairlines and borders */
  --accent: #3b5bdb;     /* the one color that carries meaning */
  --accent-ink: #ffffff; /* text on accent */
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-display: var(--font-body);
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.625rem;
  --step-3: 2.25rem;
  --measure: 68ch;
  --gutter: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111317;
    --surface: #181b20;
    --ink: #e6e8eb;
    --muted: #9aa1ab;
    --rule: #2a2f36;
    --accent: #8ea6ff;
    --accent-ink: #0d1020;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: var(--step-0)/1.6 var(--font-body);
  padding: 48px var(--gutter) 72px;
}
html:lang(zh) body { line-height: 1.75; }
.page { max-width: 72rem; margin-inline: auto; display: grid; gap: 48px; }
.page > * { min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p, li, dd { max-width: var(--measure); text-wrap: pretty; }
p { margin: 0; }
.stack { display: grid; gap: 16px; }
.lead { font-size: var(--step-1); color: var(--muted); }
a { color: var(--accent); text-underline-offset: 0.18em; }
img, svg, video, canvas { max-width: 100%; height: auto; }
figure { margin: 0; display: grid; gap: 8px; }
figcaption { color: var(--muted); font-size: var(--step--1); }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
th { font-weight: 600; }
td { overflow-wrap: break-word; }
/* Tables with 3+ columns: add class="stacked" and data-label on each cell; rows become labeled blocks below 600px. */
@media (max-width: 600px) {
  table.stacked, table.stacked tbody, table.stacked tr, table.stacked th, table.stacked td { display: block; }
  table.stacked thead { display: none; }
  table.stacked tr { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  table.stacked th, table.stacked td { border: 0; padding: 2px 0; }
  table.stacked [data-label]::before { content: attr(data-label) " "; color: var(--muted); font-size: var(--step--1); font-weight: 400; }
}
code, pre, kbd { font-family: var(--font-mono); font-size: 0.92em; }
pre { margin: 0; overflow-x: auto; padding: 12px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media print {
  body { background: #fff; color: #000; padding: 0; }
  a { color: inherit; }
}
</style>
</head>
<body>
<div class="page">
  <header class="stack">
    <h1>Page name</h1>
    <p class="lead">The answer or the point of the page, in one sentence.</p>
  </header>
  <main class="page">
    <!-- One section per sub-question. Delete what the page does not need. -->
  </main>
</div>
</body>
</html>
